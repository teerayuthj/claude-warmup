name: Claude Code Warmup

on:
  schedule:
    # GitHub Actions scheduled triggers are best-effort and, for a
    # low-activity repo, GitHub silently drops most ticks of a dense cron
    # (e.g. "*/15 0-6 * * *" only ever fired once across 2 days instead of
    # ~28 times/day) and also drifts the delivery time later day over day.
    # Spreading a handful of separate schedule entries across the morning,
    # with no post-hoc skip logic, maximizes the odds that at least one
    # actually lands close to 05:00-06:00 ICT while guaranteeing that
    # whichever one does fire always performs the real ping.
    - cron: '30 3 * * *'
      timezone: 'Asia/Bangkok'
    - cron: '0 4 * * *'
      timezone: 'Asia/Bangkok'
    - cron: '30 4 * * *'
      timezone: 'Asia/Bangkok'
    - cron: '0 5 * * *'
      timezone: 'Asia/Bangkok'
    - cron: '30 5 * * *'
      timezone: 'Asia/Bangkok'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Ping Claude to anchor 5-hour window
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding":true}' > ~/.claude.json
          claude -p "hi" --model haiku --no-session-persistence 2>&1 || true
          echo "✓ Warmup complete"

      # Prevent GitHub from disabling this scheduled workflow after 60 days of
      # repository inactivity. Pushes an empty commit only when the repo has
      # been inactive for ~50+ days, keeping the schedule alive automatically.
      # Implemented inline (no external action) to comply with the repo's
      # Actions policy, which blocks third-party actions.
      - name: Keep workflow alive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.commit.committer.date')
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "Days since last commit: $age"
          if [ "$age" -ge 50 ]; then
            echo "Repo inactive ${age}d — pushing keepalive commit."
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
            cd repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive to prevent workflow auto-disable"
            git push
          else
            echo "Repo active recently — no keepalive commit needed."
          fi

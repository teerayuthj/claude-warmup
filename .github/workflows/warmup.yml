name: Claude Code Warmup

on:
  schedule:
    # Best-effort trigger shifted 15 minutes earlier to add more buffer before 06:00 ICT.
    - cron: '52 4 * * *'
      timezone: 'Asia/Bangkok'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Ping Claude to anchor 5-hour window
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_OAUTH_TOKEN }}
        run: |
          mkdir -p ~/.claude
          echo '{"hasCompletedOnboarding":true}' > ~/.claude.json
          claude -p "hi" --model haiku --no-session-persistence 2>&1 || true
          echo "✓ Warmup complete"

      # Prevent GitHub from disabling this scheduled workflow after 60 days of
      # repository inactivity. This creates a dummy commit only when the repo is
      # close to the inactivity limit, keeping the schedule alive automatically.
      - name: Keep workflow alive
        uses: gautamkrishnar/keepalive-workflow@v2
